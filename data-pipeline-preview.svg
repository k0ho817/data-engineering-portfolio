<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="DBLAB data engineering pipeline">
  <rect width="960" height="600" fill="#f6f8fb"/>
  <text x="70" y="82" fill="#1e2329" font-family="Arial, sans-serif" font-size="34" font-weight="700">DBLAB Data Engineering Pipeline</text>
  <text x="70" y="116" fill="#667085" font-family="Arial, sans-serif" font-size="18">source data -> preprocessing -> distributed compute -> analysis/model output -> validation</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="178" width="150" height="110" rx="10" fill="#ffffff" stroke="#d7dde5" stroke-width="2"/>
    <text x="95" y="226" fill="#2563eb" font-size="22" font-weight="700">Source</text>
    <text x="95" y="254" fill="#667085" font-size="15">CSV / image / video</text>
    <rect x="260" y="178" width="150" height="110" rx="10" fill="#ffffff" stroke="#d7dde5" stroke-width="2"/>
    <text x="287" y="226" fill="#14845f" font-size="22" font-weight="700">Preprocess</text>
    <text x="287" y="254" fill="#667085" font-size="15">Python / Spark Job</text>
    <rect x="450" y="178" width="150" height="110" rx="10" fill="#ffffff" stroke="#d7dde5" stroke-width="2"/>
    <text x="482" y="226" fill="#a66b00" font-size="22" font-weight="700">Compute</text>
    <text x="482" y="254" fill="#667085" font-size="15">Spark / Ray / K8s</text>
    <rect x="640" y="178" width="150" height="110" rx="10" fill="#ffffff" stroke="#d7dde5" stroke-width="2"/>
    <text x="666" y="226" fill="#be3b46" font-size="22" font-weight="700">Output</text>
    <text x="666" y="254" fill="#667085" font-size="15">Report / model result</text>
    <path d="M225 233h34" stroke="#98a2b3" stroke-width="4" fill="none"/>
    <path d="M415 233h34" stroke="#98a2b3" stroke-width="4" fill="none"/>
    <path d="M605 233h34" stroke="#98a2b3" stroke-width="4" fill="none"/>
    <polygon points="254,225 270,233 254,241" fill="#98a2b3"/>
    <polygon points="444,225 460,233 444,241" fill="#98a2b3"/>
    <polygon points="634,225 650,233 634,241" fill="#98a2b3"/>
    <rect x="70" y="350" width="790" height="90" rx="10" fill="#ffffff" stroke="#d7dde5" stroke-width="2"/>
    <text x="100" y="394" fill="#1e2329" font-size="22" font-weight="700">Portfolio signal</text>
    <text x="100" y="423" fill="#667085" font-size="17">DBLAB Hadoop/Spark lectures, Ray/K8s runbook, Prophet analysis, log-to-CSV, Vector DB, Aquila YOLO outputs</text>
